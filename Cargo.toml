[package]
name = "rtcdesk"
version = "0.1.0"
edition = "2024"

[dependencies]
webrtc = "=0.20.0-alpha.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem", "x509-parser", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
image = "0.25"
xcap = "0.9"
axum = { version = "0.8", features = ["ws"] }
env_logger = "0.11"
stunclient = { version = "0.4", features = ["async"] }
local-ip-address = "0.6"
enigo = "0.6"
arboard = "3"
dioxus-html = "0.7"
keyboard-types = "0.7"
base64 = "0.22"
dioxus = { version = "0.7", features = [] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[[bin]]
name = "rtcdesk"
path = "src/main.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "stuncheck"
path = "src/stuncheck.rs"

