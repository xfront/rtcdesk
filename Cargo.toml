[workspace]
resolver = "3"
members = ["tools", "shared", "service", "client"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["itfront"]
description = "WebRTC Desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
base64 = "0.22"
env_logger = "0.11"
arboard = "3"
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "tls12",
    "std",
] }

# ── server deps ───────────────────────────────────────────────────────
webrtc = "=0.20.0-alpha.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "__rustls-tls",
] }
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "crypto",
    "pem",
    "x509-parser",
    "zeroize",
] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
image = "0.25"
xcap = "0.9"
axum = { version = "0.8", features = ["ws"] }
stunclient = { version = "0.4", features = ["async"] }
local-ip-address = "0.6"
enigo = "0.6"
keyboard-types = "0.7"
