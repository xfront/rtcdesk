[package]
name = "rtcdesk-client"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true

[[bin]]
name = "rtcdesk"
path = "src/main.rs"

[dependencies]
rtcdesk-shared = { path = "../shared" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
anyhow.workspace = true
futures-util.workspace = true
bytes.workspace = true
async-trait.workspace = true
env_logger.workspace = true
local-ip-address.workspace = true
clipboard-rs.workspace = true
base64.workspace = true
keyboard-types.workspace = true
webrtc.workspace = true
rtc.workspace = true
interprocess = { version = "2.4", features = ["tokio"] }
futures = "0.3"
openh264.workspace = true
dioxus = { version = "0.7" }
dioxus-html = { version = "0.7" }
dioxus-bootstrap-css = "0.3"
image.workspace = true
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rfd = "0.17"
ffmpeg-sys-next = { version = "7.1", default-features = false, features = ["avcodec", "swscale"], optional = true }
libc = { version = "0.2", optional = true }
tray-menu = "0.1"
tray = "0.1"
crossbeam-channel = "0.5"
ice0.workspace = true
ice0-macro.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tray-menu = { version = "0.1" , features = ["gtk"] }

[features]
default = ["desktop", "vaapi"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# Decode backends
vaapi = ["ffmpeg-sys-next", "libc"]


